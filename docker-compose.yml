services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - CLONE_DIR=/app/data/cloned_repos
      - DATABASE_URL=sqlite:////app/data/reposage.db
      - HF_HOME=/app/data/hf_cache
    volumes:
      - reposage_data:/app/data
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - CLONE_DIR=/app/data/cloned_repos
      - DATABASE_URL=sqlite:////app/data/reposage.db
      - HF_HOME=/app/data/hf_cache
    volumes:
      - reposage_data:/app/data
    depends_on:
      - redis

volumes:
  reposage_data:
