services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/data

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CLONE_DIR=/app/data/cloned_repos
      - HF_HOME=/app/data/hf_cache
    volumes:
      - reposage_data:/app/data
    depends_on:
      - redis
      - chroma

  worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CLONE_DIR=/app/data/cloned_repos
      - HF_HOME=/app/data/hf_cache
    volumes:
      - reposage_data:/app/data
    depends_on:
      - redis
      - chroma

  frontend:
    build: ./frontend
    ports:
      - "80:80"

volumes:
  reposage_data:
  chroma_data:
  redis_data:
