# Docker's embedded DNS resolver (127.0.0.11) -- the variable indirection
# in the location /api/ block below is what makes nginx re-resolve the
# `api` hostname on every request instead of caching it at startup.
# Without this, recreating the api container (e.g. after an env-var change)
# leaves nginx pointed at the dead container's IP until the frontend
# container is also recreated -- symptom is 502 on every /api/* request.
# valid=10s sets the TTL on the resolved record; ipv6=off defends against
# Docker DNS returning AAAA records for services that don't have working
# IPv6 outbound (we hit this with the Supabase direct connection).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin routing: nginx (in the frontend container) forwards
    # /api/* to the api container. The browser sees one origin
    # (this container's port 80), so httpOnly cookies set by /api/login
    # ride on subsequent /api/* requests without any CORS dance.
    # `api` is the compose service name -- the resolver directive above
    # makes nginx re-resolve it per request via the variable below.
    location /api/ {
        # Set per-request so nginx consults the resolver instead of caching
        # the literal hostname. proxy_pass to a $variable triggers per-request
        # DNS lookup; proxy_pass to a literal hostname does not.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering so chunks flow through to the browser
        # in real time. Without this, nginx buffers the entire response
        # and the user sees nothing until the stream ends.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # SPA fallback -- reload on any non-root path (e.g. deep in a chat
    # thread) serves index.html so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}